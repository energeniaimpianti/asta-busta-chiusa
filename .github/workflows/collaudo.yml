name: Collaudo
on:
  push:
  workflow_dispatch:

jobs:
  web:
    name: AstaWeb (Node) - suite completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test motore, parser, robustezza, server e listone ufficiale
        run: node --test AstaWeb/server/asta-server.test.js AstaWeb/server/collaudo-liste.test.js AstaWeb/server/pagine-parse.test.js

  android:
    name: App Android (Kotlin) - test e APK di verifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Test JVM + build APK debug
        working-directory: AstaChiusa
        run: ./gradlew --no-daemon test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: AstaChiusa/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
